    let currentLang = 'pt';

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key]) el.placeholder = t[key];
      });
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang === 'es' ? 'es' : 'en';
      localStorage.setItem('preferredLanguage', lang);
    }

    function detectBrowserLanguage() {
      const saved = localStorage.getItem('preferredLanguage');
      if (saved && translations[saved]) return saved;
      const browserLang = navigator.language || navigator.userLanguage;
      if (browserLang.startsWith('es')) return 'es';
      if (browserLang.startsWith('en')) return 'en';
      return 'pt';
    }

    document.getElementById('languageSelect').addEventListener('change', function() {
      setLanguage(this.value);
    });

    // ========== TEMA DARK/LIGHT ==========
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    let isDark = true;

    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        document.body.classList.remove('bg-slate-50', 'text-slate-900');
        document.body.classList.add('bg-[#090a0f]', 'text-slate-100');
        themeIcon.classList.replace('fa-moon', 'fa-sun');
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        document.body.classList.remove('bg-[#090a0f]', 'text-slate-100');
        document.body.classList.add('bg-slate-50', 'text-slate-900');
        themeIcon.classList.replace('fa-sun', 'fa-moon');
      }
    });

    // ========== DETECÇÃO DE PLATAFORMA ==========
    const urlInput = document.getElementById('urlInput');
    const detectedPlatformIcon = document.getElementById('detectedPlatformIcon');
    const detectionNotice = document.getElementById('detectionNotice');
    const detectionText = document.getElementById('detectionText');

    const platformConfigs = {
      youtube: { name: 'YouTube', icon: 'fa-brands fa-youtube', color: 'text-red-500', bg: 'bg-red-600' },
      instagram: { name: 'Instagram', icon: 'fa-brands fa-instagram', color: 'text-pink-500', bg: 'bg-pink-600' },
      tiktok: { name: 'TikTok', icon: 'fa-brands fa-tiktok', color: 'text-cyan-400', bg: 'bg-black' },
      pinterest: { name: 'Pinterest', icon: 'fa-brands fa-pinterest', color: 'text-rose-500', bg: 'bg-rose-600' },
      facebook: { name: 'Facebook', icon: 'fa-brands fa-facebook', color: 'text-blue-500', bg: 'bg-blue-600' },
    };

    function detectPlatform(val) {
      val = val.toLowerCase();
      if (val.includes('youtu.be') || val.includes('youtube.com')) return 'youtube';
      if (val.includes('instagram.com')) return 'instagram';
      if (val.includes('tiktok.com')) return 'tiktok';
      if (val.includes('pinterest.com') || val.includes('pin.it')) return 'pinterest';
      if (val.includes('facebook.com') || val.includes('fb.watch')) return 'facebook';
      return 'other';
    }

    urlInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      const detected = detectPlatform(val);
      if (detected && detected !== 'other') {
        const info = platformConfigs[detected];
        detectedPlatformIcon.innerHTML = `<i class="${info.icon} ${info.color}"></i>`;
        detectionNotice.classList.remove('hidden');
        detectionText.innerHTML = `Plataforma detectada: <strong class="text-white">${info.name}</strong>`;
      } else {
        detectedPlatformIcon.innerHTML = '<i class="fa-solid fa-link"></i>';
        if (!val) detectionNotice.classList.add('hidden');
        else {
          detectionNotice.classList.remove('hidden');
          detectionText.innerHTML = `Link geral detectado`;
        }
      }
    });

    async function handlePasteClipboard() {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text) {
            urlInput.value = text;
            urlInput.dispatchEvent(new Event('input'));
          }
        } else {
          urlInput.focus();
        }
      } catch (err) {
        urlInput.focus();
      }
    }

    function clearInput() {
      urlInput.value = '';
      detectedPlatformIcon.innerHTML = '<i class="fa-solid fa-link"></i>';
      detectionNotice.classList.add('hidden');
      document.getElementById('resultCard').classList.add('hidden');
    }

    // ========== LÓGICA REAL DA API COM ROTEAMENTO INTELIGENTE ==========
    const API_URL = "/api";
    let currentVideoData = null;

    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      document.getElementById('toastText').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    async function handleAnalyze(e) {
      if (e) e.preventDefault();
      const url = urlInput.value.trim();
      if (!url) {
        showToast(translations[currentLang].alertInvalidUrl);
        return;
      }

      const btn = document.getElementById('submitBtn');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');
      
      btn.disabled = true;
      btnIcon.className = 'fa-solid fa-spinner fa-spin';
      btnText.textContent = '...';

      try {
        // ROTEAMENTO INTELIGENTE: YouTube usa endpoint próprio, resto usa o padrão
        const platform = detectPlatform(url);
        const infoEndpoint = platform === 'youtube' ? API_URL + '/youtube-info' : API_URL + '/info';

        const response = await fetch(infoEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });
        const data = await response.json();

        if (data.detail) {
          showToast(data.detail);
          throw new Error(data.detail);
        }

        // Salva a plataforma nos dados para usar no download
        currentVideoData = { ...data, platform: platform };
        
        // Preencher UI
        document.getElementById('resThumb').src = data.thumbnail || 'https://via.placeholder.com/400x225?text=No+Thumbnail';
        document.getElementById('resTitle').textContent = data.title;
        document.getElementById('resAuthor').innerHTML = `<i class="fa-regular fa-user mr-1"></i> ${data.uploader || translations[currentLang].unknownAuthor}`;
        
        const mins = Math.floor((data.duration || 0) / 60);
        const secs = (data.duration || 0) % 60;
        document.getElementById('resDuration').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

        const info = platformConfigs[platform] || platformConfigs.youtube;
        const badge = document.getElementById('resPlatformBadge');
        badge.className = `absolute top-2 left-2 ${info.bg} text-white text-[11px] font-semibold px-2 py-0.5 rounded-md flex items-center gap-1 shadow-md`;
        badge.innerHTML = `<i class="${info.icon}"></i> ${info.name}`;

        // Preencher Select de Qualidade
        const select = document.getElementById('formatSelect');
        select.innerHTML = '';
        
        // Opção MP3 apenas onde há suporte real (YouTube e TikTok)
        if (platform === 'youtube' || platform === 'tiktok') {
          const mp3Opt = document.createElement('option');
          mp3Opt.value = 'mp3';
          mp3Opt.textContent = platform === 'youtube'
            ? '🎵 MP3 (Áudio de Alta Qualidade - 320kbps)'
            : '🎵 Som original do TikTok (MP3/M4A)';
          select.appendChild(mp3Opt);
        }

        // Opções de vídeo da API
        if (data.formats && Array.isArray(data.formats)) {
          data.formats.forEach(fmt => {
            const opt = document.createElement('option');
            opt.value = fmt.format_id;
            // Fallback seguro: RapidAPI pode usar 'quality', yt-dlp usa 'resolution' ou 'format_note'
            const res = fmt.resolution || fmt.quality || fmt.format_note || 'Qualidade Padrão';
            const ext = fmt.ext || (fmt.type === 'audio' ? 'mp3' : 'mp4');
            opt.textContent = `🎬 ${res} - ${ext.toUpperCase()}`;
            select.appendChild(opt);
          });
        }

        // Mostrar card com animação
        const resCard = document.getElementById('resultCard');
        resCard.classList.remove('hidden');
        setTimeout(() => {
          resCard.classList.remove('opacity-0', 'translate-y-4');
          resCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 30);

      } catch (error) {
        console.error(error);
      } finally {
        btn.disabled = false;
        btnIcon.className = 'fa-solid fa-magnifying-glass';
        btnText.textContent = translations[currentLang].analyzeBtn;
      }
    }

    // ========== DOWNLOAD REAL COM BARRA DE PROGRESSO E ROTEAMENTO ==========
    function triggerRealDownload() {
      if (!currentVideoData || !urlInput.value.trim()) return;

      const formatValue = document.getElementById('formatSelect').value;
      const isAudio = (formatValue === 'mp3');
      const platform = currentVideoData.platform || detectPlatform(urlInput.value.trim()) || 'other';
      
      let endpoint;
      let payload;

      // ROTEAMENTO INTELIGENTE DE DOWNLOAD
      if (platform === 'youtube') {
        endpoint = API_URL + '/youtube-download';
        // Envia format_id (ou 'mp3'). O backend do YouTube deve saber lidar com isso via RapidAPI
        payload = { url: urlInput.value.trim(), format_id: formatValue };
      } else {
        endpoint = isAudio ? API_URL + '/download-audio' : API_URL + '/download';
        payload = isAudio ? { url: urlInput.value.trim() } : { url: urlInput.value.trim(), format_id: formatValue };
      }

      const btn = document.getElementById('startDownloadBtn');
      const btnIcon = document.getElementById('dlBtnIcon');
      const btnText = document.getElementById('dlBtnText');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressLabel = document.getElementById('progressLabel');
      const progressPercent = document.getElementById('progressPercent');

      // UI de carregamento
      btn.disabled = true;
      btnIcon.className = 'fa-solid fa-spinner fa-spin';
      btnText.textContent = translations[currentLang].downloadingText;
      progressContainer.classList.remove('hidden');
      progressBar.style.width = '0%';
      progressPercent.textContent = '0%';
      progressLabel.textContent = translations[currentLang].processingText;

      // XMLHttpRequest para progresso real de download (MANTIDO)
      const xhr = new XMLHttpRequest();
      xhr.open('POST', endpoint, true);
      xhr.responseType = 'blob';

      xhr.onprogress = function(event) {
        if (event.lengthComputable) {
          const percentComplete = Math.round((event.loaded / event.total) * 100);
          progressBar.style.width = percentComplete + '%';
          progressPercent.textContent = percentComplete + '%';
          if (percentComplete > 10 && percentComplete < 90) {
            progressLabel.textContent = isAudio ? 'Extraindo e baixando áudio...' : 'Baixando pacotes de vídeo...';
          } else if (percentComplete >= 90) {
            progressLabel.textContent = 'Finalizando arquivo...';
          }
        }
      };

      xhr.onload = function() {
        if (xhr.status === 200) {
          progressBar.style.width = '100%';
          progressPercent.textContent = '100%';
          progressLabel.textContent = '✓ Download pronto!';
          
          // Extrair nome do arquivo do header
          const disposition = xhr.getResponseHeader('Content-Disposition') || '';
          let filename = isAudio ? 'audio.mp3' : 'video.mp4';
          const match = disposition.match(/filename\*=UTF-8''([^;]+)/i);
          if (match && match[1]) {
            filename = decodeURIComponent(match[1]);
          }

          const blob = xhr.response;
          const downloadUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(downloadUrl);

          // Resetar botão após 3 segundos
          setTimeout(() => {
            progressContainer.classList.add('hidden');
            btn.disabled = false;
            btnIcon.className = 'fa-solid fa-arrow-down-to-bracket';
            btnText.textContent = translations[currentLang].downloadBtn;
          }, 3000);

        } else {
          // Tratar erro do servidor
          const reader = new FileReader();
          reader.onload = function() {
            try {
              const err = JSON.parse(reader.result);
              showToast(translations[currentLang].alertDownloadError + (err.detail || 'Erro desconhecido'));
            } catch (e) {
              showToast(translations[currentLang].alertDownloadError + 'Falha no servidor');
            }
            resetDownloadUI();
          };
          reader.readAsText(xhr.response);
        }
      };

      xhr.onerror = function() {
        showToast(translations[currentLang].alertDownloadError + 'Erro de rede');
        resetDownloadUI();
      };

      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.send(JSON.stringify(payload));

      function resetDownloadUI() {
        progressContainer.classList.add('hidden');
        btn.disabled = false;
        btnIcon.className = 'fa-solid fa-arrow-down-to-bracket';
        btnText.textContent = translations[currentLang].downloadBtn;
      }
    }

    // ========== FAQ ACCORDION ==========
    function toggleFaq(btn) {
      const content = btn.nextElementSibling;
      const icon = btn.querySelector('.fa-chevron-down');
      const isOpen = !content.classList.contains('hidden');

      document.querySelectorAll('.faq-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('#faq .fa-chevron-down').forEach(i => i.classList.remove('rotate-180'));

      if (!isOpen) {
        content.classList.remove('hidden');
        icon.classList.add('rotate-180');
      }
    }

    // Inicialização
    const initialLang = detectBrowserLanguage();
    document.getElementById('languageSelect').value = initialLang;
    setLanguage(initialLang);
  </script>
